<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Dark Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F131D"/>
      <stop offset="100%" stop-color="#06080D"/>
    </linearGradient>

    <!-- Diagonal Inner Shadow from Top-Left (matching reference) -->
    <linearGradient id="diagonalShade" x1="100" y1="100" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="45%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#0B132B" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Electric Blue QR Gradient -->
    <linearGradient id="blueQR" x1="160" y1="160" x2="352" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Clip path to keep diagonal shadow strictly inside the white frame -->
    <clipPath id="innerOpening">
      <rect x="110" y="110" width="292" height="292" rx="65"/>
    </clipPath>

    <!-- Subtle frame shadow -->
    <filter id="frameShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle dark border -->
  <rect x="4" y="4" width="504" height="504" rx="108" stroke="#1E293B" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Inner diagonal ambient shadow matching reference photo -->
  <g clip-path="url(#innerOpening)">
    <rect x="110" y="110" width="292" height="292" fill="#0A0E17"/>
    <polygon points="110,110 402,402 110,402" fill="url(#diagonalShade)"/>
  </g>

  <!-- Big White Rounded Frame (Outer QR Eye from reference) -->
  <rect x="86" y="86" width="340" height="340" rx="88" stroke="#FFFFFF" stroke-width="46" fill="none" filter="url(#frameShadow)"/>

  <!-- The Little Blue QR Code inside (replacing solid blue square) -->
  <g id="mini-qr" fill="url(#blueQR)">
    <!-- Top-Left Mini Eye -->
    <rect x="168" y="168" width="66" height="66" rx="16" stroke="url(#blueQR)" stroke-width="13" fill="none"/>
    <rect x="191" y="191" width="20" height="20" rx="5"/>

    <!-- Top-Right Mini Eye -->
    <rect x="278" y="168" width="66" height="66" rx="16" stroke="url(#blueQR)" stroke-width="13" fill="none"/>
    <rect x="301" y="191" width="20" height="20" rx="5"/>

    <!-- Bottom-Left Mini Eye -->
    <rect x="168" y="278" width="66" height="66" rx="16" stroke="url(#blueQR)" stroke-width="13" fill="none"/>
    <rect x="191" y="301" width="20" height="20" rx="5"/>

    <!-- Center Column (Col 3) Data / Timing -->
    <rect x="246" y="172" width="20" height="20" rx="5"/>
    <rect x="246" y="209" width="20" height="20" rx="5"/>
    <rect x="246" y="246" width="20" height="20" rx="5"/>
    <rect x="246" y="283" width="20" height="20" rx="5"/>
    <rect x="246" y="320" width="20" height="20" rx="5"/>

    <!-- Center Row (Row 3) Data / Timing -->
    <rect x="172" y="246" width="20" height="20" rx="5"/>
    <rect x="209" y="246" width="20" height="20" rx="5"/>
    <rect x="283" y="246" width="20" height="20" rx="5"/>
    <rect x="320" y="246" width="20" height="20" rx="5"/>

    <!-- Bottom-Right Quadrant Data Cells -->
    <rect x="283" y="283" width="20" height="20" rx="5"/>
    <rect x="320" y="283" width="20" height="20" rx="5"/>
    <rect x="283" y="320" width="20" height="20" rx="5"/>
    <rect x="320" y="320" width="20" height="20" rx="5"/>
  </g>
</svg>
